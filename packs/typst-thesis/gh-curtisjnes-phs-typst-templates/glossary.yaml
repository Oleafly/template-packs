# Glossar-Einträge für die Arbeit
#
# Verwendung in Kapiteln:
#   @lorem-ipsum          -> zeigt "Lorem Ipsum (LI)" beim ersten Mal, dann "LI"
#   @lorem-ipsum:long     -> immer Langform
#   @lorem-ipsum:short    -> immer Kurzform
#   @lorem-ipsum:pl       -> Plural-Form

# Fachbegriffe
lorem-ipsum:
  short: LI
  long: Lorem Ipsum
  description: Ein Platzhaltertext, der seit dem 16. Jahrhundert in der Druckindustrie verwendet wird

dolor-sit:
  short: DSA
  long: Dolor Sit Amet
  description: Ein Konzept der modernen Textverarbeitung zur Darstellung von Layoutstrukturen

consectetur:
  short: CAE
  long: Consectetur Adipiscing Elit
  description: Ein methodischer Ansatz zur systematischen Analyse von Adipiscing-Prozessen

# Allgemeine Abkürzungen
zb:
  short: z.B.
  long: zum Beispiel

dh:
  short: d.h.
  long: das heißt

usw:
  short: usw.
  long: und so weiter
