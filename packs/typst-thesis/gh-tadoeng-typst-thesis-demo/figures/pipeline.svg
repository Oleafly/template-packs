<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320">
  <rect width="1000" height="320" fill="#ffffff"/>
  <style>
    .box{fill:#f5f8fc;stroke:#8aa5c5;stroke-width:2;rx:16;ry:16}
    .text{font: 700 24px 'Segoe UI', Arial, sans-serif; fill:#1d3557}
    .sub{font: 16px 'Segoe UI', Arial, sans-serif; fill:#375a7f}
    .arrow{stroke:#6c8fb3;stroke-width:5;fill:none;marker-end:url(#m)}
  </style>
  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6c8fb3"/>
    </marker>
  </defs>
  <rect class="box" x="40" y="90" width="180" height="120"/>
  <text class="text" x="130" y="135" text-anchor="middle">Working .edb</text>
  <text class="sub" x="130" y="165" text-anchor="middle">Engineer edits model</text>
  <rect class="box" x="290" y="90" width="180" height="120"/>
  <text class="text" x="380" y="135" text-anchor="middle">Export .e2k</text>
  <text class="sub" x="380" y="165" text-anchor="middle">Diffable text snapshot</text>
  <rect class="box" x="540" y="90" width="180" height="120"/>
  <text class="text" x="630" y="135" text-anchor="middle">Validate</text>
  <text class="sub" x="630" y="165" text-anchor="middle">Metadata + checks</text>
  <rect class="box" x="790" y="90" width="170" height="120"/>
  <text class="text" x="875" y="135" text-anchor="middle">Report</text>
  <text class="sub" x="875" y="165" text-anchor="middle">Tables, charts, PDF</text>
  <path class="arrow" d="M220 150 L290 150"/>
  <path class="arrow" d="M470 150 L540 150"/>
  <path class="arrow" d="M720 150 L790 150"/>
</svg>
