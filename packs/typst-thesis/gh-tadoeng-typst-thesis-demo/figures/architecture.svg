<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">
  <rect width="1000" height="500" fill="#ffffff"/>
  <style>
    .panel{fill:#f8fafc;stroke:#9db4cc;stroke-width:2;rx:16;ry:16}
    .title{font: 700 26px 'Segoe UI', Arial, sans-serif; fill:#16324f}
    .text{font: 17px 'Segoe UI', Arial, sans-serif; fill:#36506b}
    .arrow{stroke:#7d98b8;stroke-width:4;fill:none;marker-end:url(#m)}
  </style>
  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#7d98b8"/>
    </marker>
  </defs>
  <rect class="panel" x="60" y="70" width="250" height="160"/>
  <text class="title" x="185" y="115" text-anchor="middle">ETABS Sidecar</text>
  <text class="text" x="185" y="150" text-anchor="middle">Open model</text>
  <text class="text" x="185" y="178" text-anchor="middle">Export .e2k</text>
  <text class="text" x="185" y="206" text-anchor="middle">Trigger analysis</text>

  <rect class="panel" x="375" y="70" width="250" height="160"/>
  <text class="title" x="500" y="115" text-anchor="middle">Core Engine</text>
  <text class="text" x="500" y="150" text-anchor="middle">Parse and diff snapshots</text>
  <text class="text" x="500" y="178" text-anchor="middle">Store metadata</text>
  <text class="text" x="500" y="206" text-anchor="middle">Generate report inputs</text>

  <rect class="panel" x="690" y="70" width="250" height="160"/>
  <text class="title" x="815" y="115" text-anchor="middle">Desktop / UI</text>
  <text class="text" x="815" y="150" text-anchor="middle">Browse branches</text>
  <text class="text" x="815" y="178" text-anchor="middle">Compare alternatives</text>
  <text class="text" x="815" y="206" text-anchor="middle">Read reports</text>

  <rect class="panel" x="250" y="300" width="500" height="120"/>
  <text class="title" x="500" y="345" text-anchor="middle">Shared data contract</text>
  <text class="text" x="500" y="380" text-anchor="middle">version metadata • analysis outputs • chart/table payloads</text>

  <path class="arrow" d="M310 150 L375 150"/>
  <path class="arrow" d="M625 150 L690 150"/>
  <path class="arrow" d="M500 230 L500 300"/>
</svg>
