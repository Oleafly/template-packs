# Настройки нумерации распространяются только на формулы.
# Нумерация для рисунков и таблиц настраивается по необходимости вручную
# по аналогии с нумерацией формул

# Доступные опции для настройки нумерации:
#   eq_numbering_style: "continuous" — сквозная нумерация формул,
#     не зависящая от глав: (1), (2), ..., (n-1), (n).
#   eq_numbering_style: "nested" — нумерация отдельно в каждой главе:
#     (1.1), (1.2), ..., (2.1), (2.2), ...

eq_numbering_style: "nested"

# Если выбрано eq_numbering_by_default: false, то нумерация будет
# добавляться только к уравнениям, у которых есть метка (label)
# для ссылки на них в тексте.
# Если выбрано eq_numbering_by_default: true, то по умолчанию нумеруются
# все центрированные уравнения, а для отключения нумерации в отдельных
# случаях нужно использовать #math.equation(numbering: false, block: true)[$a^2+b^2=c^2$]

eq_numbering_by_default: false

# Параметр поддерживает два вида значений
# 1) theorem_numbering_style: "continuous" 
#    нумерует теоремы сквозным образом (Т. 1, Т. 2,…, Т. n)
# theorem_numbering_style: "k"  
#    если k — это натуральное число, то в нумерации теоремы 1.1.
#    первые k чисел будут совпадать с нумерацией
#    первых k уровней (под-)глав
#    Пример:  theorem_numbering_style: "2", тогда
#    Нумерация имеет вид 1.1.1, 1.1.2 … 1.1.n; 2.3.1, 2.3.2 … 2.3.n
#    Пример:  theorem_numbering_style: "1", тогда
#    Нумерация имеет вид 1.1, 1.2 … 1.n; 2.1, 2.2 … 2.n
#    
#    Число k представлено как строкой
#    theorem_numbering_style: "2"
#       так и числом
#    theorem_numbering_style: 2

theorem_numbering_style: "continuous"

emulate_libre_office: true