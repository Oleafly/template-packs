# Your thesis. Everything here is merged over schools/<school>.yml, so you can
# also override any format rule from the preset without editing it.

# school: nccu # pick one of schools/*.yml; without it the format defaults apply

title: "○○○○○○"
title-en: "○○○○○○"

author: "○○○"
author-en: "○○○"
id: "000000000"

advisor: "○○○"
advisor-en: "○○○"

college: "○○學院"
college-en: "College of ○○"
institute: "○○學系"
institute-en: "Department of ○○"

degree: "碩士"
degree-en: "Master"
type: "論文"
type-en: "Thesis"

date: "○○○○-○○-○○" # publication, YYYY-MM-DD
oral-date: "○○○○-○○-○○" # defense, YYYY-MM-DD

keywords: ["Typst", "中文", "論文", "模板"]
keywords-en: ["Typst", "CJK", "Thesis", "Template"]

# Caption positions: top | bottom
layout:
  caption-position:
    image: "bottom"
    table: "bottom"
    code: "bottom"

# Page numbers: keep defaults, or use e.g. top / right / "第 {page} 頁".
page-number:
  position: "bottom" # top | bottom
  align: "center" # left | center | right
  format: "{page}"

# Heading cross-references: C = chapter, S = section, B = subsection.
# Set chapter/section/subsection to "C" / "C.S" / "C.S.B" for 2 / 2.5 / 2.5.1.
cross-ref:
  numbering: ~ # ~ uses Chinese numerals for a Chinese thesis; "1" uses Arabic numerals
  chapter: "第{C}章"
  section: "第{C}章第{S}節"
  subsection: "第{C}章第{S}節第{B}小節"

bibliography:
  path: ["/contents/back/references.bib"] # .bib or hayagriva .yml
