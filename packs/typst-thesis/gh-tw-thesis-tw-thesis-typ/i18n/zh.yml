# Traditional Chinese defaults for the language-paired keys in
# schools/default.yml's `strings:` block. A school preset or config.yml can
# still override any of these as `strings.xxx` (see lib/config.typ, which
# splices this file's `xxx-en` counterpart from i18n/en.yml into the same
# dict) -- this file only supplies the Chinese baseline.

strings:
  advisor-label: "指導教授："
  doctor: "博士"
  chapter: ["第", "章"] # wraps the level-1 chapter number, e.g. 第一章
  section: ["第", "節"] # wraps the level-2 section number, e.g. 第一節
  figure: "圖" # prefix before a figure's number, e.g. 圖 1
  table: "表" # prefix before a table's number, e.g. 表 1
