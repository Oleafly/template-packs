# English defaults for the language-paired keys in schools/default.yml's
# `strings:` block. Every key here becomes `xxx-en` once merged with
# i18n/zh.yml's `xxx` in lib/config.typ. A school preset or config.yml can
# still override the merged `strings.xxx-en` key directly.

strings:
  advisor-label: "Advisor:"
  doctor: "Ph.D."
  chapter: "Chapter" # prefixes the chapter number, e.g. Chapter 5
  section: "Section" # prefixes the section number, e.g. Section 2
  figure: "Figure" # prefix before a figure's number, e.g. Figure 1
  table: "Table" # prefix before a table's number, e.g. Table 1
