# Education entries — displayed top to bottom, newest first

- degree-type: Bachelor of Science     # Degree type
  degree-name: Computer Science        # Degree name — combined as "B.Sc. - Computer Science"
  timeframe: "October 2021 - present"  # Date range shown on right
  institution: Technical University of Munich
  location: Germany
  notes:                               # Optional — remove block if no sub-content needed
    - text: Research Assistant         # Role or note title
      bold: true                       # Makes text bold
      timeframe: "April 2024 - Present"  # Right-aligned date on same line (optional)
      sub:                             # Level-2 bullets (optional)
        - label: Supervisor            # Bold label before text
          text: Prof. Dr. Jane Smith
        - label: Topic
          text: Machine Learning for Code Analysis
          bold-text: true              # Makes text after label bold too (optional)
        - label: Paper                 # Label + inline link
          link-text: "View on arXiv"
          link-url: "https://arxiv.org/example"
          suffix: ", 2024"             # Text after link (optional)
        - text: "Plain sub-bullet without label"

    - text: Thesis
      bold: true
      sub:
        - label: Title
          text: Your Thesis Title Here
          bold-text: true
        - label: Technologies
          text: "Python, PyTorch, Transformers"

