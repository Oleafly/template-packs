position: Infrastructure Engineer

tagline:
  - Infrastructure Engineer with hands-on production experience designing, automating, and operating Linux infrastructure across virtualization, container platforms, and CI/CD environments.
  - Skilled in Infrastructure-as-Code and configuration automation.
  - Strong background in Linux systems administration, storage, and self-hosted infrastructure.
  - Experienced in monitoring and observability with a foundation in system hardening and security practices.
  - Mentor engineers through structured training on Linux, Containers, Kubernetes, CI/CD, and Cloud Infrastructure.

