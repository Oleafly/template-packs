
# Set the language of your documens.
# That is impotent for linebrakes .etc. 
[layout]
language = "de"
paper_size = "a4"
show_photo = true
[layout.margin]
left = "2.5cm"
right = "2cm"
top = "2cm"
bottom = "2.7cm"
[layout.spaceing]
section = "1em"
skill = "-0.5em"
[layout.spaceing.entry]
before = "0.3em"
organization = "0.5em"
description = "-0.3em"
des_entry = "0.9em"

[style]
base_font = "Rambla"
base_font_size = "10pt"
base_color = "#031026"
accent_font = "Roboto"
accent_color = "#cf2930"
photo_radius = "50%"
[style.section]
smallcaps = true

