#:schema https://raw.githubusercontent.com/yunanwg/brilliant-CV/main/metadata.toml.schema.json
header_quote = "让我们把翅膀借给彼此"
cv_footer = "知更鸟简历"
letter_footer = "申请信"

[layout]
# 主题颜色, 内置 skyblue, red, nephritis, concrete, darknight, 也可使用 16 进制颜色
awesome_color = "#868DCF"
before_section_skip = "1pt"
before_entry_skip = "1pt"
before_entry_description_skip = "1pt"
paper_size = "a4"
# Wider date column accommodates Chinese month/year strings.
date_width = "4.7cm"

[layout.fonts]
# Three font groups for bilingual (English + Chinese) typesetting.
# Typst's codepoint-level fallback picks the CJK font for Chinese
# characters and the Latin font for English automatically.
header-font = ["Arial", "LXGW WenKai"]                      # name, section title, entry title
regular-font = ["New Computer Modern", "Noto Serif CJK SC"] # body / default
italic-font = ["New Computer Modern", "KaiTi"]              # honor location, entry location

[layout.header]
header_align = "left"
display_profile_photo = true
profile_photo_radius = "50%"
info_font_size = "10pt"

[layout.entry]
display_entry_society_first = true
display_logo = true

[layout.section]
# CJK convention: section title rendered in accent color as a whole,
# not split into "first N letters + rest" — splitting Chinese
# characters by codepoint count is rarely meaningful.
title_highlight = "full"

[layout.footer]
display_page_counter = false
display_footer = true


[inject]
# 注入词, 用于通过 ai 审核
injected_keywords_list = ["寰宇歌手", "同协行者"]

[personal]
first_name = "Robin"
last_name = ""
# display_name overrides the Latin "first (light) + last (bold)" split
# with a single CJK string in the first-name light style.
display_name = "知更鸟 Robin"

[personal.info]
#github = "IceySwan"
phone = "1234567890"
email = "robin@penacony.com"
# linkedin = "johndoe"
# gitlab = "yunanwg"
# homepage = "icey.one"
# orcid = "0000-0000-0000-0000"
location = "皮诺康尼"

