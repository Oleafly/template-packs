# -----------------------------------------------------------------------------
# CV content. Rendered by cv-academia.typ and cv-industry.typ.
# Text fields support typst markup like *bold* and _italic_.
# -----------------------------------------------------------------------------

name: Jane Doe
title: Research Scientist @ Example Labs, PhD in Example Engineering

# summary paragraphs, one per cv variant
academic-summary: "Applied researcher specializing in *keyword one* and *keyword two*. I develop *rigorous* and *high-performance* methods for modeling and simulation, with implementations in *Python/PyTorch*. I am interested in applying these tools to *large-scale real-world problems*."

industry-summary: "Applied researcher with a PhD in Example Engineering. I develop efficient numerical and data-driven methods for complex systems, combining optimization, scientific computing, and machine learning. I translate research into scalable Python software and seek to apply this quantitative approach to real-world products."

# rendered top-to-bottom in the sidebar
contacts:
  - name: janedoe.example
    link: https://janedoe.example
    id: web
  - name: mail@janedoe.example
    link: mailto:mail@janedoe.example
    id: mail
  - name: github.com/janedoe
    link: https://github.com/janedoe
    id: github
  # these also render fine
  # - name: Google Scholar
  #   link: https://scholar.google.com/citations?user=EXAMPLE
  #   id: googlescholar
  # - name: ORCID
  #   link: https://orcid.org/0000-0000-0000-0000
  #   id: orcid

research_highlights:
  - name: Research topic one
    info: "Two or three sentences on what you did, how you did it, and which tools you used. It should be cool. You can also provide some supplementary material."
    further_reading:
      - name: Paper
        url: https://doi.org/10.0000/example
      - name: Preprint
        url: https://arxiv.org/abs/0000.00000
      - name: Code
        url: https://github.com/janedoe/example

  - name: Research topic two
    info: "Another highlight, like a method you proved and validated on real data."
    further_reading:
      - name: Slides
        url: https://janedoe.example/slides

education:
  - university:
      name: Example University
      link: https://example.org
    degree: "PhD"
    major: Example Engineering
    since: 2021
    defended: 2025
    grade: "_summa cum laude_"
    thesis: Title of the doctoral thesis
    supervised_by: "Prof.~A.~Mentor"

  - university:
      name: Example University
      link: https://example.org
    degree: "M. Sc."
    major: Example Engineering
    from: 2019
    to: 2021
    grade: "3.9/4.0"
    grading_system: "GPA"
    thesis: Title of the master thesis
    supervised_by: "Prof.~A.~Mentor"
    coursework: "*Machine learning*, convex optimization"

  - university:
      name: Another University
      link: https://example.org
    degree: "B. Sc."
    major: Mathematics
    from: 2016
    to: 2019
    grade: "3.7/4.0"
    grading_system: "GPA"
    thesis: Title of the bachelor thesis

experience:
  - name: Senior Research Scientist
    bonusname: machine learning # optional second line next to the job title
    employer: Example Lab
    since: 2025
    activity: "One or two sentences on your role and what you built."

  - name: Doctoral Researcher
    bonusname: scientific computing
    employer: Example University
    from: 2021
    to: 2025
    activity: "Developed numerical methods for X. Collaborated with national partners on Y."

  - name: Software Engineering Intern
    employer: Example Corp
    from: 2020
    to: 2020
    activity: "Implemented feature Z in Python and improved its runtime by 40%."

# categories fill the two columns row by row
skills:
  - name: Programming
    items:
      - name: Python
        info: PyTorch, NumPy
      - name: C++
      - name: Rust
      - name: Bash

  - name: Tools
    items:
      - name: Git
        info: CI/CD
      - name: LaTeX
      - name: Typst

  - name: Methods
    items:
      - name: machine learning
      - name: data-driven modeling

  - name: Languages
    items:
      - name: English
        info: fluent
      - name: German
        info: native

# entries with journal == "preprint" go to the preprints section,
# entries with journal == "PhD Thesis" are skipped in the academic cv
publications:
  - title: "Journal paper number one"
    author: "J. Doe, A. Coauthor"
    year: 2025
    journal: Journal of Example Studies
    url: https://doi.org/10.0000/example

  - title: "Journal paper number two"
    author: "A. Coauthor, J. Doe"
    year: 2024
    journal: Transactions on Examples
    url: https://doi.org/10.0000/example2

  - title: "Title of an arXiv preprint"
    author: "J. Doe"
    year: 2024
    journal: preprint
    url: https://arxiv.org/abs/0000.00000

  - title: "Title of the doctoral thesis"
    author: "J. Doe"
    year: 2025
    journal: "PhD Thesis"
    url: https://example.org/thesis

# rendered at the end of the academic cv
references:
  - name: Prof. Dr. Ada Mentor
    link: https://example.org/~mentor
    affiliation: Example University
    relation: PhD supervisor
    mail: mentor@example.org

  - name: Prof. Dr. Bob Coauthor
    link: https://example.org/~coauthor
    affiliation: Another University
    relation: Coauthor
    mail: coauthor@example.org

awards:
  - name: Best Example Award
    link: https://example.org/award
    year: 2024
    description: One sentence on what the award recognizes.

  - name: Example Fellowship
    link: https://example.org/fellowship
    year: "2022 - 2024"
    description: One sentence on the fellowship program.

  - name: Honorary Mention
    link: https://example.org/mention
    year: 2021
    description: One sentence on the context.

# type: talk | poster | other. only "talk" appears in the academic cv
activities:
  - name: "Example Conference 2025"
    link: https://example.org/conf25
    year: 2025
    date: Jun. 01 - Jun. 05
    location: Berlin, Germany
    contribution:
      - Talk on research topic one.
      - Invited by A. Coauthor.
    type: talk
    id: conf25

  - name: "Example Workshop 2024"
    link: https://example.org/workshop24
    year: 2024
    date: Sep. 10 - Sep. 12
    location: Zurich, Switzerland
    contribution:
      - Poster on research topic two.
    type: poster
    id: workshop24

teaching:
  - name: Analysis I
    year: 2026
    description: Designed assignments and exams, coordinated tutors, held exercise sessions.
  - name: Linear Algebra I
    year: 2025
    description: Held tutorial sessions and corrected assignments and exams.

# rendered in the "Leadership and Service" section of the academic cv
service:
