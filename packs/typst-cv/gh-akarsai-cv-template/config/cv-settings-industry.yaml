# Appearance of the industry cv (cv-industry.typ).
#
# "New Computer Modern" is bundled with typst, so no extra font files are
# needed. To use another font like Helvetica, put the .ttf files into
# assets/fonts/ and set the family name here (the build looks there).

font:
  size:
    heading_huge: 19pt # name
    heading_large: 16pt # section headings
    heading: 14pt # job title
    description: 10.45pt # body text
    tiny: 8pt # footnotes like the GPA scale
  general: "New Computer Modern"
  minor_highlight: "New Computer Modern" # secondary text like dates and employers

accent-color: blue.darken(20%) # links

paragraph:
  # Distance between lines
  leading: 4pt
