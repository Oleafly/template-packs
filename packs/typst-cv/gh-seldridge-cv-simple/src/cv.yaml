  - company: SiFive
    location: Santa Clara, CA
    remote: true
    roles:
      - title: Principal Engineer
        dates:
          start: {year: 2022, month: 9, day: 15}
      - title: Senior Staff Engineer
        dates:
          start: {year: 2020, month: 9, day: 14}
          end: {year: 2022, month: 9, day: 15}
    summary: |
      I co-led the migration of SiFive's Verilog compiler for the Chisel hardware description language from a Scala-based implementation to an MLIR-based one using and building the LLVM CIRCT project, achieving ~10x faster compilation and ~4x lower peak memory usage across a sweep of SiFive designs.  I now lead a three-person team extending Chisel/CIRCT with design verification and physical design capabilities, including probes for internal signal access, layers for optional collateral, design-colocated automated testing, and clock and power domain modeling.  I am also a maintainer of the open-source CIRCT and Chisel projects and the FIRRTL (Chisel's intermediate representation) specification.
