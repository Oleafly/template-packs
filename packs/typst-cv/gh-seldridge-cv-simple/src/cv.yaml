      - title: Postdoctoral Research
        dates:
          start: {day: 27, month: 08, year: 2016}
          end:   {day: 02, month: 02, year: 2019}
    summary: |
      I joined IBM after my Ph. D. to work on the DARPA PERFECT and, later, DSSoC projects.  I deployed a machine learning accelerator I developed during my Ph. D. for low-voltage experiments, developed compiler passes for hardware fault injection, and researched agile hardware design (languages and methodologies) to improve designer productivity.
