projects_title: "Projekty własne"

projects_intro: >
  Poligon do weryfikowania koncepcji architektonicznych w działającym kodzie —
  od modelu domeny i warstwy integracji po wdrożenie na Kubernetes.

projects:
  - name: "Tutum Platform"
    link: "tutum-pro.io"
    note: >
      Platforma dystrybucji certyfikatów X.509 dla Kubernetes i Dockera — mTLS,
      szyfrowanie AES-256-GCM, automatyczna walidacja ważności, narzędzia CLI.
      Ok. 12 tys. linii kodu; publiczna dokumentacja techniczna, licencja dualna.

  - name: "L2A / Applio — platforma wniosków leasingowych"
    link: "www.ratovia.com"
    note: >
      Działające demo. Pięć mikroserwisów w Go z własnym silnikiem formuł: DSL,
      kompilator do bytecode'u, maszyna stosowa i persystentny cache skompilowanych
      programów. Produkty wersjonowane treścią (sha256), FSM cyklu życia wniosku
      i kontraktu, koordynator BPMN. Angular, wdrożenie na Kubernetes.

  - name: "archirules"
    link: "github.com/tutum-pro/archirules"
    note: >
      Otwarta metodyka dokumentowania decyzji architektonicznych — rejestry ADR,
      pytań otwartych i faz projektu, wraz z automatyczną weryfikacją spójności.
      Licencja CC BY-SA 4.0.

projects_note: >
  Dostęp do kodu źródłowego jest chroniony. Na potrzeby procesu rekrutacyjnego
  mogę go udostępnić na żądanie oraz zaprezentować rozwiązania w praktyce.

