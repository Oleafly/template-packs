# Hayagriva's YAML bibliography format.
# Reference: https://github.com/typst/hayagriva/blob/main/docs/file-format.md
#
# Cite an entry from a chapter with its key, e.g. @vaswani2017.
#
# Prefer BibTeX? Typst reads .bib files just as well. Put your refs.bib beside
# this file, point `bibliography.path` in config.typ at it, and delete this
# file. Everything else, including the @key citations in your chapters, stays
# exactly the same. That is usually the better choice if you are exporting
# citations from Google Scholar, IEEE Xplore, Zotero or Mendeley rather than
# writing them out by hand.

vaswani2017:
  type: article
  title: Attention Is All You Need
  author: ["Vaswani, Ashish", "Shazeer, Noam", "Parmar, Niki"]
  date: 2017
  parent:
    type: proceedings
    title: Advances in Neural Information Processing Systems
    volume: 30
  url: https://arxiv.org/abs/1706.03762

typst-docs:
  type: web
  title: Typst Documentation
  publisher: Typst GmbH
  url:
    value: https://typst.app/docs/
    date: 2025-01-01
