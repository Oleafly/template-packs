<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">Ejemplo de convergencia</title>
  <desc id="desc">Dos curvas de mejor valor acumulado disminuyen a medida que aumenta el número de evaluaciones.</desc>
  <rect width="900" height="440" fill="#ffffff"/>
  <line x1="90" y1="360" x2="840" y2="360" stroke="#18213d" stroke-width="2"/>
  <line x1="90" y1="60" x2="90" y2="360" stroke="#18213d" stroke-width="2"/>
  <g stroke="#dfe4ef" stroke-width="1">
    <line x1="90" y1="300" x2="840" y2="300"/>
    <line x1="90" y1="240" x2="840" y2="240"/>
    <line x1="90" y1="180" x2="840" y2="180"/>
    <line x1="90" y1="120" x2="840" y2="120"/>
  </g>
  <polyline fill="none" stroke="#2458b8" stroke-width="5" points="90,90 165,138 240,172 315,210 390,236 465,256 540,278 615,292 690,305 765,318 840,326"/>
  <polyline fill="none" stroke="#13845f" stroke-width="5" points="90,90 165,175 240,226 315,260 390,290 465,310 540,325 615,336 690,344 765,350 840,353"/>
  <g font-family="sans-serif" font-size="20" fill="#18213d">
    <text x="425" y="410">Evaluaciones</text>
    <text x="25" y="235" transform="rotate(-90 25 235)">Mejor valor acumulado</text>
  </g>
  <g font-family="sans-serif" font-size="18" fill="#18213d">
    <line x1="560" y1="78" x2="610" y2="78" stroke="#2458b8" stroke-width="5"/>
    <text x="625" y="84">Random Search</text>
    <line x1="560" y1="108" x2="610" y2="108" stroke="#13845f" stroke-width="5"/>
    <text x="625" y="114">Hill Climbing</text>
  </g>
</svg>
