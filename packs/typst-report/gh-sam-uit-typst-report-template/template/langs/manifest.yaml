# template/langs/manifest.yaml
# Language pack registry — lists every available language pack.
#
# To add a new language:
#   1. Create template/langs/<bcp47-lowercase>.yaml with the label keys
#   2. Add an entry below with the canonical code and any short-code aliases
#
# "code" must match the YAML filename (without .yaml extension).
# "aliases" are alternate codes accepted by i18n-labels() — e.g. short ISO
# codes or alternate casing forms that users are likely to type.

languages:
  - code: en-us
    aliases:
      - en

  - code: vi-vn
    aliases:
      - vi

  - code: ms-my
    aliases:
      - ms

  - code: zh-hant
    aliases:
      - zh-Hant    # Typst canonical casing

  - code: zh-hans
    aliases:
      - zh-Hans    # Typst canonical casing
