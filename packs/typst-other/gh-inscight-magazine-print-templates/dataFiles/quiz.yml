title: "Science Quiz: Indian Women Scientists"
intro: "How well do you know the women who helped shape Indian science?"
author: "*Swarnendu Saha* [IIT Bombay]"
1:
  q: "Which Indian botanist was one of the first Indian women to obtain a PhD in a scientific field abroad and is particularly known for her work on plant cytogenetics, chromosome studies, and sugarcane breeding?"
  o:
    - Anna Mani
    - E. K. Janaki Ammal
    - Asima Chatterjee
    - Kamal Ranadive
  a: 2
2:
  q: "Asima Chatterjee made major contributions to Indian medicinal chemistry. Her research included the chemistry of alkaloids and compounds derived from which natural sources?"
  o:
    - Plants
    - Marine organisms
    - Meteorites
    - Fossil fuels
  a: 1
  i: "/images/quiz1.jpg"
3:
  q: "Anna Mani is particularly associated with the development and standardisation of meteorological instruments in India. Which of the following was also a major area of her scientific work?"
  o:
    - Atmospheric ozone
    - Nuclear fission
    - Quantum computing
    - Molecular genetics
  a: 1
4:
  q: "Kamal Ranadive is remembered particularly for her pioneering research into:"
  o:
    - Cancer and the relationship between cancer and viruses
    - Gravitational waves
    - Indian monsoon dynamics
    - Semiconductor physics
  a: 1
5:
  q: "Which Indian woman physicist is particularly known for her contributions to particle physics, including work related to the Higgs boson and physics beyond the Standard Model?"
  o:
    - Rohini Godbole
    - Tessy Thomas
    - Rajeshwari Chatterjee
    - Anna Mani
  a: 1
7:
  q: "Rajeshwari Chatterjee was a pioneer in which field, becoming one of India's earliest women engineers to work extensively in it?"
  o:
    - Microwave engineering
    - Biochemical engineering
    - Nuclear medicine
    - Agricultural engineering
  a: 1
6:
  q: "Tessy Thomas is popularly associated with which area of Indian scientific and technological development?"
  o:
    - Missile technology
    - Vaccine development
    - Space telescope design
    - Agricultural genetics
  a: 1
  i: "/images/quiz2.png"
8:
  q: "Which scientist's work involved polyploidy and chromosome studies in plants, and whose research contributed to the development of improved varieties of crops such as sugarcane?"
  o:
    - Kamal Ranadive
    - Janaki Ammal
    - Rohini Godbole
    - Anna Mani
  a: 2
10:
  q: "Who am I? I worked in a field where women were relatively uncommon when I began my career. My research involved plant-derived compounds, particularly alkaloids, and I investigated their potential medicinal applications. I became one of India's most prominent women organic chemists."
  o:
    - Janaki Ammal
    - Asima Chatterjee
    - Anna Mani
    - Kamal Ranadive
  a: 2
  i: "/images/quiz3.jpg"
9:
  q: "Which scientist among the following is most directly associated with the study and measurement of atmospheric ozone and the development of precision meteorological instruments, rather than with biology, chemistry, or particle physics?"
  o:
    - Rohini Godbole
    - Anna Mani
    - Kamal Ranadive
    - Asima Chatterjee
  a: 2
