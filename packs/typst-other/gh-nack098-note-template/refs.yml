# Hayagriva reference file
# Docs: https://github.com/typst/hayagriva/blob/main/docs/file-format.md
#
# Usage in your .typ file:
#   #bibliography("refs.yml")                        -- default style
#   #bibliography("refs.yml", style: "ieee")         -- IEEE
#   #bibliography("refs.yml", style: "apa")          -- APA 7th
#   #bibliography("refs.yml", style: "chicago-author-date")
#
# BibTeX also works — just point to a .bib file instead.
#   #bibliography("refs.bib", style: "ieee")
#
# Cite with @key anywhere in your text:
#   As shown in @knuth1997, ...   ->  inline citation
#   [@knuth1997, p. 42]           ->  parenthetical with page
#   @knuth1997 @pike1989          ->  multiple in sequence

typst:
  type: web
  title: "Typst: A new markup-based typesetting system"
  author: Typst GmbH
  url: https://typst.app
  date: 2023

catppuccin:
  type: web
  title: "Catppuccin: Soothing pastel theme for the high-spirited"
  author: Catppuccin Org
  url: https://github.com/catppuccin/catppuccin
  date: 2021

inter:
  type: web
  title: "Inter: A typeface for highly legible text on screens"
  author: Rasmus, Rasmus
  url: https://rsms.me/inter
  date: 2017

knuth1997:
  type: book
  title: "The Art of Computer Programming, Volume 1: Fundamental Algorithms"
  author: Knuth, Donald E.
  publisher: Addison-Wesley Professional
  date: 1997
  edition: 3

pike1989:
  type: web
  title: Notes on Programming in C
  author: Pike, Rob
  url: https://doc.cat-v.org/bell_labs/pikestyle
  date: 1989
