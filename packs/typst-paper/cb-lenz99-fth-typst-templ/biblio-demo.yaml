stanley_changing_2022:
  type: anthos
  title:
    value: The Changing Face of Mission Studies since the Nineteenth Century
    short: Changing Face
  author: Stanley, Brian
  date: 2022
  editor:
  - Kim, Kirsteen
  - Fitchett-Climenhaga, Alison
  page-range: 19-36
  abstract: This chapter surveys the main trends in the emergence and evolution of the academic study of Christian missions since the late nineteenth century. It notes the pioneering roles in the development of “the science of missions” (Missionswissenschaft) played by the Catholic Joseph Schmidlin and the Protestants Gustav Warneck and J. H. Oldham, secretary of the World Missionary Conference 1910, and founding editor of the International Review of Missions (1912). The chapter goes on to discuss the changing relationship of mission studies or “missiology” to new fields of study, such as the history of religions and later of “world Christianity.” Attention is paid to the formation of the International Association for Mission Studies in 1972. Recent years have witnessed the gradual diversification of the mission studies community, which is now fully ecumenical, inclusive in terms of gender, and more reflective of the contributions of non-Western scholars and church leaders.
  parent:
    type: anthology
    title: The Oxford Handbook of Mission Studies
    publisher:
      name: Oxford University Press
      location: Oxford

