kremers_competing_2021:
  type: article
  title:
    value: 'Competing Risk Analysis: What Does It Mean and When Do We Need It in Orthopedics Research?'
    short: Competing Risk Analysis
  author:
  - Kremers, Hilal Maradit
  - Devick, Katrina L.
  - Larson, Dirk R.
  - Lewallen, David G.
  - Berry, Daniel J.
  - Crowson, Cynthia S.
  date: 2021-10
  page-range: 3362-3366
  url:
    value: https://pmc.ncbi.nlm.nih.gov/articles/PMC8478701/
    date: 2025-12-30
  serial-number:
    doi: 10.1016/j.arth.2021.04.015
    issn: 0883-5403
  abstract: Most orthopedic studies involve survival analyses examining the time to an event of interest, such as a specific complication or revision surgery. Competing risks commonly arise in such studies when patients are at risk of more than one mutually exclusive event, such as death, or when the rate of an event depends on the rates of other competing events. In this paper, we briefly describe the survival analysis censoring methodology, common fatal and non-fatal competing events and define circumstances where standard survival analysis can fail in the setting of competing risks with real-world examples from orthopedics.
  parent:
    type: periodical
    title: The Journal of arthroplasty
    issue: 10
    volume: 36

